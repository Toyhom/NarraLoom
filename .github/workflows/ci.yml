name: Framework checks
on: [push, pull_request]
jobs:
  cpu-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: python scripts/verify.py --distribution
      - run: python scripts/check_docs.py
      - run: python scripts/export_schemas.py && git diff --exit-code -- schemas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-reports
          path: outputs/validation/**/report.json
