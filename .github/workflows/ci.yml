name: Framework checks
on: [push, pull_request]
jobs:
  cpu-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: python scripts/verify.py --distribution --output outputs/validation/ci
      - run: python -m playwright install --with-deps chromium
      - name: Reference workspace navigation
        run: |
          python -m roleplay_world serve --workspace "$PWD/outputs/browser-host" --web-dist "$PWD/outputs/validation/ci/web" --port 18991 > outputs/browser-host.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --silent --fail --output /dev/null http://127.0.0.1:18991/
          python scripts/check_workspace_browser.py --url http://127.0.0.1:18991 --output outputs/validation/workspace
          python scripts/check_provider_browser.py --url http://127.0.0.1:18991 --output outputs/validation/providers
          python scripts/check_optional_avatar_browser.py --url http://127.0.0.1:18991 --output outputs/validation/optional-avatar
      - run: python scripts/check_docs.py
      - run: python scripts/check_public_tree.py
      - run: python scripts/export_schemas.py && git diff --exit-code -- schemas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-reports
          path: outputs/validation/**/report.json
  model-tools:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: narraloom models list
      - run: narraloom models download avatar-2d --model-root ./model-plan --mirror --dry-run
      - run: python -c "from pathlib import Path; assert not Path('model-plan').exists()"
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t narraloom .
      - name: Container frontend, API and persistent workspace
        run: |
          docker run -d --name narraloom --hostname narraloom -p 127.0.0.1:18090:18090 -v narraloom-workspace:/workspace narraloom
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:18090/healthz
          curl --fail --silent --output /dev/null http://127.0.0.1:18090/
          curl --fail --silent --output /dev/null http://127.0.0.1:18090/docs
          docker exec narraloom python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
          docker exec narraloom sha256sum /workspace/data/writer-node.json > before.txt
          docker stop narraloom
          docker rm narraloom
          docker run -d --name narraloom --hostname narraloom -p 127.0.0.1:18090:18090 -v narraloom-workspace:/workspace narraloom
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 --fail http://127.0.0.1:18090/healthz
          docker exec narraloom sha256sum /workspace/data/writer-node.json > after.txt
          diff before.txt after.txt
      - if: failure()
        run: docker logs narraloom
