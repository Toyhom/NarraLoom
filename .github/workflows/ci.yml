name: Framework checks
on: [push, pull_request]
jobs:
  cpu-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: npm ci
      - run: python scripts/verify.py --distribution --output outputs/validation/ci
      - run: python -m playwright install --with-deps chromium
      - name: Reference workspace navigation
        run: |
          python -m roleplay_world serve --workspace outputs/browser-host --web-dist outputs/validation/ci/web --port 18991 > outputs/browser-host.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 15 --retry-connrefused --retry-delay 1 --silent --fail --output /dev/null http://127.0.0.1:18991/
          python scripts/check_workspace_browser.py --url http://127.0.0.1:18991 --output outputs/validation/workspace
          python scripts/check_provider_browser.py --url http://127.0.0.1:18991 --output outputs/validation/providers
      - run: python scripts/check_docs.py
      - run: python scripts/export_schemas.py && git diff --exit-code -- schemas
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-reports
          path: outputs/validation/**/report.json
