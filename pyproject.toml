[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roleplay-world"
version = "0.22.1"
description = "Modular story-game AI framework with an embeddable backend and deterministic world state"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "jsonschema>=4.25,<5"]

[project.urls]
Homepage = "https://github.com/Toyhom/NarraLoom"
Documentation = "https://github.com/Toyhom/NarraLoom/tree/main/guides"
Issues = "https://github.com/Toyhom/NarraLoom/issues"

[project.scripts]
narraloom = "roleplay_world.cli:main"

[project.optional-dependencies]
embedding = ["torch>=2.6,<3", "transformers>=4.51,<6"]
jev = ["torch==2.14.0", "transformers==5.17.0", "tokenizers==0.23.2", "numpy>=1.26,<2.6"]
avatar = ["Pillow>=10,<13"]
download = ["huggingface_hub>=0.34,<2"]
research = ["jsonschema>=4.25,<5"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.55,<2", "Pillow>=10,<13", "setuptools>=77", "wheel", "jsonschema>=4.25,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roleplay_world = ["builtin/*.json", "builtin/starters/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=scratch/pytest"

[tool.ruff]
line-length = 115
target-version = "py311"
